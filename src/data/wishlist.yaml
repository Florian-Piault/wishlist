# Liste d'exemple : à remplacer par la vraie liste.
# Chaque clé est un slug unique (il sert d'ancre). Un slug doit contenir une
# lettre : une clé purement numérique (« 2024: ») passerait en tête de liste
# et fausserait l'ordre du fichier à égalité de prix. Champs :
#   title (requis), url (requis, http ou https), category (requis :
#   books, games, tech, home, clothing, misc), price ou range { min, max }
#   (l'un des deux requis ; price l'emporte si les deux sont remplis),
#   image (optionnelle, chemin vers src/assets/items/), note, priority: high.
# Un élément reçu se supprime du fichier.
# La catégorie « clothing » est laissée vide exprès : elle ne s'affiche pas.

roman-policier:
